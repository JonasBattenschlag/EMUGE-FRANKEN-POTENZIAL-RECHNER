<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMUGE Potenzial-Kalkulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: white;
        }
        header {
            background: linear-gradient(90deg, #ea580c 0%, #c2410c 100%);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        header h1 {
            font-size: 24px;
            font-weight: bold;
        }
        header p {
            font-size: 12px;
            opacity: 0.9;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            padding-bottom: 40px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }
        .card h2 {
            font-size: 20px;
            margin-bottom: 16px;
            color: #22c55e;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-row {
            display: flex;
            gap: 12px;
        }
        .input-row .input-group {
            flex: 1;
            margin-bottom: 0;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            background: #334155;
            border: 1px solid #475569;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #ea580c;
            box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.1);
        }
        .result {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        .result-value {
            font-size: 48px;
            font-weight: 900;
            margin: 16px 0;
        }
        .result-class {
            font-size: 24px;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 16px;
            background: #ea580c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 16px;
            min-height: 48px;
        }
        button:hover {
            background: #c2410c;
        }
        button:active {
            background: #92300c;
        }
        .breakdown {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            font-size: 14px;
        }
        .breakdown-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .breakdown-item:last-child {
            border-bottom: none;
        }
        .breakdown-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }
        .breakdown-section-title {
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .machine-ratio {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            font-size: 13px;
            color: #cbd5e1;
        }
        .section-header {
            background: rgba(234, 88, 12, 0.1);
            border-left: 3px solid #ea580c;
            padding: 12px;
            margin: 16px 0 12px 0;
            border-radius: 4px;
            font-weight: bold;
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; justify-content: center; gap: 16px;">
            <span style="font-size: 48px;">🔧</span>
            <div>
                <h1>Potenzial-Kalkulator</h1>
                <p>EMUGE FRANKEN</p>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2>📊 Eingabe</h2>
            
            <div class="input-group">
                <label>🏭 Branche</label>
                <select id="industry" onchange="updateResult()">
                    <option value="auto">Automobil</option>
                    <option value="zweirad">Zweirad</option>
                    <option value="schiene">Schiene</option>
                    <option value="schiff">Schiffbau</option>
                    <option value="luft">Luft- und Raumfahrt</option>
                    <option value="land">Landtechnik/Bauwesen</option>
                    <option value="lohn">Lohnfertiger</option>
                    <option value="masch">Allg. Maschinen- und Anlagenbau</option>
                    <option value="form">Werkzeug-/Formenbau</option>
                    <option value="elektro">Elektro-Industrie</option>
                    <option value="wz">Werkzeughersteller</option>
                    <option value="mikro">Mikrotechnik/Unterhaltungselektronik</option>
                    <option value="oem">OEM-Kunden</option>
                    <option value="bau">Bau-Industrie</option>
                    <option value="milvh">Militärische Fahrzeuge</option>
                    <option value="milfl">Militärische Fluggeräte</option>
                    <option value="mun">Munition und Waffen</option>
                    <option value="med">Medizintechnik</option>
                    <option value="dental">Dental</option>
                    <option value="kraft">Kraftwerkstechnologie</option>
                    <option value="wind">Windkraft</option>
                    <option value="oilgas">Öl & Gas</option>
                </select>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label>🔄 Drehmaschinen</label>
                    <input type="number" id="drehen" value="0" min="0" onchange="updateResult()" oninput="updateResult()">
                </div>
                <div class="input-group">
                    <label>🔪 Fräsmaschinen</label>
                    <input type="number" id="frasen" value="15" min="0" onchange="updateResult()" oninput="updateResult()">
                </div>
            </div>

            <div class="input-group">
                <label>🔩 Material</label>
                <select id="material" onchange="updateResult()">
                    <option value="kunst">Kunststoff</option>
                    <option value="alu">Aluminium</option>
                    <option value="guss">Guss</option>
                    <option value="stahl">Stahl</option>
                    <option value="verguet">Vergütungsstahl</option>
                    <option value="edel">Edelstahl</option>
                    <option value="titan">Titan</option>
                    <option value="inconel">Inconel/Ni-Basis</option>
                </select>
            </div>

            <div class="input-group">
                <label>⏰ Schichtmodell</label>
                <select id="shifts" onchange="updateResult()">
                    <option value="1">1 Schicht</option>
                    <option value="2">2 Schichten</option>
                    <option value="3">3 Schichten</option>
                </select>
            </div>

            <div class="section-header">💰 Spanntechnik</div>

            <div class="input-group">
                <label>🔗 Sonder SPT</label>
                <select id="sonderSpt" onchange="updateResult()">
                    <option value="0">Kein Potenzial</option>
                    <option value="15000">15 bis 30.000€</option>
                    <option value="30000">30 bis 50.000€</option>
                    <option value="50000">50 bis 100.000€</option>
                    <option value="100000">mehr als 100.000€</option>
                </select>
            </div>

            <div class="input-group">
                <label>🔗 Standard SPT (Evo Grip)</label>
                <select id="standardSpt" onchange="updateResult()">
                    <option value="5-10">5 bis 10 Evo Grip</option>
                    <option value="10-15">10 bis 15 Evo Grip</option>
                    <option value="15-20">15 bis 20 Evo Grip</option>
                    <option value="20-30">20 bis 30 Evo Grip</option>
                    <option value="30+">mehr als 30 Evo Grip</option>
                </select>
            </div>
        </div>

        <div id="resultCard" class="result">
            <p style="font-size: 12px; opacity: 0.8;">Jahrespotenzial</p>
            <div class="result-value" id="resultValue">€ 75k</div>
            <div class="result-class" id="resultClass">Klasse B</div>
            <div class="breakdown" id="breakdown"></div>
        </div>

        <div class="card">
            <h2>👤 Kunde speichern</h2>
            <div class="input-group">
                <label>Kundenname</label>
                <input type="text" id="customerName" placeholder="z.B. Mayer GmbH">
            </div>
            <div class="input-group">
                <label>Kundennummer (optional)</label>
                <input type="text" id="customerNumber" placeholder="z.B. K-12345">
            </div>
            <button onclick="saveCustomer()">💾 Speichern</button>
        </div>
    </div>

    <script>
        function updateResult() {
            const drehen = parseFloat(document.getElementById('drehen').value) || 0;
            const frasen = parseFloat(document.getElementById('frasen').value) || 0;
            const totalMachines = drehen + frasen;

            if (totalMachines === 0) {
                document.getElementById('resultValue').textContent = '€ 0';
                document.getElementById('resultClass').textContent = 'Keine Maschinen';
                return;
            }

            const industry = document.getElementById('industry').value;
            const material = document.getElementById('material').value;
            const shifts = parseFloat(document.getElementById('shifts').value);
            const sonderSpt = parseInt(document.getElementById('sonderSpt').value) || 0;
            const standardSpt = document.getElementById('standardSpt').value;

            const factors = {
                auto: 1.0, zweirad: 0.9, schiene: 1.1, schiff: 1.2, luft: 1.3, land: 0.95,
                lohn: 1.1, masch: 1.0, form: 1.05, elektro: 1.0, wz: 1.15, mikro: 1.2,
                oem: 1.05, bau: 0.9, milvh: 1.25, milfl: 1.35, mun: 1.3, med: 1.2,
                dental: 1.15, kraft: 1.1, wind: 1.05, oilgas: 1.15
            };

            const materials = {
                kunst: 0.60, alu: 0.65, guss: 0.95, stahl: 1.0, verguet: 1.20,
                edel: 1.30, titan: 1.90, inconel: 2.50
            };

            // VERBRAUCHSWERKZEUGE (Basis-Potenzial)
            const basePotential = Math.round(
                totalMachines * 5000 * shifts * materials[material] * factors[industry]
            );

            // Intelligente Verteilung
            const drehAnteil = drehen / totalMachines;
            const fraesAnteil = frasen / totalMachines;

            const drehenDist = { gew: 0.35, fra: 0.20, boh: 0.35 };
            const fraesenDist = { gew: 0.10, fra: 0.45, boh: 0.25 };

            const gew = (drehAnteil * drehenDist.gew) + (fraesAnteil * fraesenDist.gew);
            const fra = (drehAnteil * drehenDist.fra) + (fraesAnteil * fraesenDist.fra);
            const boh = (drehAnteil * drehenDist.boh) + (fraesAnteil * fraesenDist.boh);

            const breakdown = {
                'Emuge Gewindetechnik': Math.round(basePotential * gew),
                'Franken Frästechnik': Math.round(basePotential * fra),
                'Emuge VHM Bohrtechnik': Math.round(basePotential * boh),
                'Sonder SPT': sonderSpt,
                'Standard SPT (Evo Grip)': standardSpt
            };

            // GESAMT-POTENZIAL = Verbrauch + Sonder SPT
            const totalPotential = basePotential + sonderSpt;

            let klasse, color;
            if (totalPotential >= 150000) { klasse = 'A'; color = '#10b981'; }
            else if (totalPotential >= 75000) { klasse = 'B'; color = '#3b82f6'; }
            else if (totalPotential >= 25000) { klasse = 'C'; color = '#eab308'; }
            else if (totalPotential >= 5000) { klasse = 'D'; color = '#f97316'; }
            else { klasse = 'E'; color = '#6b7280'; }

            document.getElementById('resultCard').style.background = `linear-gradient(135deg, ${color}dd 0%, ${color} 100%)`;
            document.getElementById('resultValue').textContent = `€ ${(totalPotential / 1000).toFixed(0)}k`;
            document.getElementById('resultClass').textContent = `Klasse ${klasse}`;
            
            let breakdownHTML = '<strong>📊 Verbrauchswerkzeuge:</strong><br>';
            
            // Verbrauchswerkzeuge
            for (let [key, val] of Object.entries(breakdown)) {
                if (!['Sonder SPT', 'Standard SPT (Evo Grip)'].includes(key)) {
                    const pct = ((val / basePotential) * 100).toFixed(0);
                    breakdownHTML += `<div class="breakdown-item"><span>${key}</span><strong>€ ${val.toLocaleString('de-DE')} (${pct}%)</strong></div>`;
                }
            }

            // Spanntechnik separat
            breakdownHTML += `<div class="breakdown-section"><div class="breakdown-section-title">💰 SPANNTECHNIK (Investition):</div>`;
            if (sonderSpt > 0) {
                breakdownHTML += `<div class="breakdown-item"><span>Sonder SPT</span><strong>€ ${breakdown['Sonder SPT'].toLocaleString('de-DE')}</strong></div>`;
            }
            breakdownHTML += `<div class="breakdown-item"><span>Standard SPT (${breakdown['Standard SPT (Evo Grip)']}) </span><strong>mit Evo Grip</strong></div>`;
            breakdownHTML += `</div>`;
            
            // Maschinenanteil
            breakdownHTML += `<div class="machine-ratio">🔄 Drehen: ${(drehAnteil * 100).toFixed(0)}% | 🔪 Fräsen: ${(fraesAnteil * 100).toFixed(0)}%</div>`;
            
            document.getElementById('breakdown').innerHTML = breakdownHTML;
        }

        function saveCustomer() {
            const name = document.getElementById('customerName').value;
            if (!name) {
                alert('Kundennamen eingeben!');
                return;
            }

            // Potenzial aus dem Display extrahieren
            const potenzialText = document.getElementById('resultValue').textContent;
            const potenzialMatch = potenzialText.match(/(\d+)/);
            const potenzial = potenzialMatch ? parseInt(potenzialMatch[1]) * 1000 : 0;

            // Alle Daten sammeln
            const data = {
                kundenname: document.getElementById('customerName').value,
                kundennummer: document.getElementById('customerNumber').value,
                branche: document.getElementById('industry').value,
                drehen: parseFloat(document.getElementById('drehen').value) || 0,
                frasen: parseFloat(document.getElementById('frasen').value) || 0,
                material: document.getElementById('material').value,
                shifts: document.getElementById('shifts').value,
                sonderSpt: parseInt(document.getElementById('sonderSpt').value) || 0,
                standardSpt: document.getElementById('standardSpt').value,
                potenzial: potenzial,
                klasse: document.getElementById('resultClass').textContent.replace('Klasse ', '')
            };

            // An Google Apps Script senden
            fetch('https://script.google.com/macros/s/AKfycbxG_WQj3x4-hT0ze9wYojM_zvDS23Ap4t54h3RWo9Ve0Z-oIUtppTfjNdvbaRKAuo8q/exec', {
                method: 'POST',
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === 'success') {
                    alert(`✅ Kunde "${name}" in Google Sheets gespeichert!`);
                    document.getElementById('customerName').value = '';
                    document.getElementById('customerNumber').value = '';
                } else {
                    alert(`❌ Fehler: ${result.message}`);
                }
            })
            .catch(error => {
                alert(`❌ Fehler beim Speichern: ${error.message}`);
            });
        }

        updateResult();
    </script>
</body>
</html>
